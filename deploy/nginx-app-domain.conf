server {
    listen 443 ssl;
    server_name app.domain.com;

    # TLS config is environment-specific
    # ssl_certificate     /etc/letsencrypt/live/app.domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.domain.com/privkey.pem;

    # All public routes are provided by Express, including OAuth, privacy,
    # and account-deletion pages.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

