<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover + the safe-area insets in styles.css keep the layout clear
      of the notch and home indicator once the app is added to the home screen.
      user-scalable=no stops the double-tap zoom that otherwise fires while a
      student is jabbing at the code field.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7A1414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Attendance" />
    <!--
      Inter, as in the original React app the Android theme was mirrored from.
      The server's CSP already allows fonts.googleapis.com / fonts.gstatic.com.
      `display=swap` plus the system fallback in styles.css means text is never
      invisible while it loads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/app/icon.svg" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <title>Attendance — University of Peradeniya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
