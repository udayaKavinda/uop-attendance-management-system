name: Deploy to attendance.eng.pdn.ac.lk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Nothing reaches the server until this passes. The deploy job installs with
  # `--omit=dev`, so jest is not even present there — the suite has to run in its
  # own checkout, against the full dependency tree.
  test:
    runs-on: [self-hosted, linux, x64, attendance-prod]
    timeout-minutes: 15
    env:
      # This runner IS the production host, and since production moved off Atlas the
      # address the probe would find — 127.0.0.1:27017 — IS the production mongod. It
      # is no longer a near-empty decoy sharing a name; it is the live database, on the
      # same box, one default away. globalSetup probes that address whenever
      # MONGO_TEST_URI is unset OR empty, so 'off' is the only value that means "do not
      # look": with it the live-database suite skips and the other 35 run.
      #
      # The suite would land in `uop_attendance_test` rather than `attendance`, and
      # dbIntegration refuses outright if those two names ever match, so this is not the
      # last line of defence. It is the first, and the cheap one. A test process has no
      # business opening connections to the production server at all.
      MONGO_TEST_URI: 'off'
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      # --include=dev is the point: jest, supertest and the web build toolchain
      # all live in devDependencies, and the runner sets NODE_ENV=production for
      # the deploy job. Nothing installed here is shipped — this is a scratch
      # checkout, separate from APP_DIR.
      - name: Install server dependencies
        run: PATH=/usr/bin:$PATH /usr/bin/npm --prefix server ci --include=dev --no-audit --no-fund

      # NODE_ENV=test is set HERE, not left to Jest's default, because Jest only
      # supplies it when the variable is unset — and this runner is the production
      # host, where it may well already read `production`. Both ways that can land
      # break the run, neither legibly:
      #
      #   NODE_ENV=production, no SESSION_SECRET -> config/env.js calls
      #     process.exit(1) as it is required, killing the Jest workers. 14 suites
      #     report "Jest worker encountered 4 child process exceptions", which says
      #     nothing about the actual cause.
      #   NODE_ENV=production, SESSION_SECRET set -> middlewares/testAuth.js
      #     disables its test-only auth bypass, and 130 tests fail on 401s.
      #
      # Either way every deploy is blocked by a red job that looks like a code
      # regression and is not one. Pinning it here makes the suite independent of
      # whatever the host's ambient environment happens to hold.
      # Catches a broken client before the deploy job wipes web/dist and rebuilds
      # it in place — where a compile error would leave the served bundle missing.
      #
      # Runs BEFORE the server suite, not after, because two tests in
      # webApp.routes.test.js gate themselves on web/dist/index.html existing
      # (`const whenBuilt = isBuilt ? test : test.skip`) — the PWA manifest and
      # iOS home-screen icon check, and the asset cache-header check. web/dist is
      # gitignored, so a fresh checkout never has it, and with the build ordered
      # last those two had never executed on any CI run: not failing, silently
      # absent, and a skipped test is indistinguishable from a passing one in the
      # summary line. Building first costs nothing — the same build already
      # happened in this job — and has the side benefit of failing a broken client
      # before spending time on the server suite.
      - name: Type-check and build the web client
        run: |
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web ci --include=dev --no-audit --no-fund
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web run build
          test -f web/dist/index.html || { echo "web build produced no dist/index.html"; exit 1; }

      # The web workspace had no tests at all until the staff dashboard's error
      # banner turned out to carry the same bug the Android one had already been
      # fixed for. Wired in here deliberately: a suite nothing runs is worth about
      # as much as no suite, which is the lesson from the two webApp tests above.
      - name: Run web client tests
        run: PATH=/usr/bin:$PATH /usr/bin/npm --prefix web test

      - name: Run server test suite
        env:
          NODE_ENV: test
        run: PATH=/usr/bin:$PATH /usr/bin/npm --prefix server test

  deploy:
    needs: test
    runs-on: [self-hosted, linux, x64, attendance-prod]
    timeout-minutes: 20
    env:
      APP_DIR: /opt/attendance/app
      NODE_ENV: production
    steps:
      - name: Show context
        run: |
          echo "branch=main"
          echo "runner=$(hostname)"
          echo "user=$(id -un)"
          echo "node=$(/usr/bin/node -v)"
          echo "npm=$(/usr/bin/npm -v)"
          echo "app_dir=$APP_DIR"

      - name: Sync code into APP_DIR
        run: |
          cd "$APP_DIR"
          echo "PREVIOUS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --all --prune
          git reset --hard origin/main
          git clean -fdx -e .env

      - name: Server syntax check
        run: |
          cd "$APP_DIR"
          /usr/bin/node --check server/src/server.js

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix server ci --omit=dev --no-audit --no-fund

      # The iOS web client is served by Express from web/dist (same origin as the
      # API — Safari blocks third-party cookies, so it cannot live anywhere else).
      # `git clean -fdx` above wipes the previous build, so it is rebuilt here on
      # every deploy.
      #
      # --include=dev is required, not optional: the job sets NODE_ENV=production,
      # which makes npm skip devDependencies by default — and the entire build
      # toolchain (typescript, vite, @vitejs/plugin-react) lives there. Only the
      # built output is shipped, so nothing dev-only reaches the served bundle.
      - name: Build web client
        run: |
          cd "$APP_DIR"
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web ci --include=dev --no-audit --no-fund
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web run build
          test -f web/dist/index.html || { echo "web build produced no dist/index.html"; exit 1; }

      - name: Restart attendance service
        run: sudo /bin/systemctl restart attendance

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/api/healthz > /dev/null; then
              echo "healthy on main"; exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          sudo systemctl status attendance --no-pager | head -n 30
          cd "$APP_DIR"
          git reset --hard "$PREVIOUS_SHA"
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix server ci --omit=dev --no-audit --no-fund
          # web/dist is untracked, so the reset above leaves the failed deploy's
          # bundle in place; rebuild it so the client matches the rolled-back API.
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web ci --include=dev --no-audit --no-fund
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web run build
          sudo /bin/systemctl restart attendance
          exit 1
