name: Deploy to attendance.eng.pdn.ac.lk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, attendance-prod]
    timeout-minutes: 20
    env:
      APP_DIR: /opt/attendance/app
      NODE_ENV: production
    steps:
      - name: Show context
        run: |
          echo "branch=main"
          echo "runner=$(hostname)"
          echo "user=$(id -un)"
          echo "node=$(/usr/bin/node -v)"
          echo "npm=$(/usr/bin/npm -v)"
          echo "app_dir=$APP_DIR"

      - name: Sync code into APP_DIR
        run: |
          cd "$APP_DIR"
          echo "PREVIOUS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --all --prune
          git reset --hard origin/main
          git clean -fdx -e .env

      - name: Server syntax check
        run: |
          cd "$APP_DIR"
          /usr/bin/node --check server/src/server.js

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix server ci --omit=dev --no-audit --no-fund

      # The iOS web client is served by Express from web/dist (same origin as the
      # API — Safari blocks third-party cookies, so it cannot live anywhere else).
      # `git clean -fdx` above wipes the previous build, so it is rebuilt here on
      # every deploy.
      #
      # --include=dev is required, not optional: the job sets NODE_ENV=production,
      # which makes npm skip devDependencies by default — and the entire build
      # toolchain (typescript, vite, @vitejs/plugin-react) lives there. Only the
      # built output is shipped, so nothing dev-only reaches the served bundle.
      - name: Build web client
        run: |
          cd "$APP_DIR"
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web ci --include=dev --no-audit --no-fund
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web run build
          test -f web/dist/index.html || { echo "web build produced no dist/index.html"; exit 1; }

      - name: Restart attendance service
        run: sudo /bin/systemctl restart attendance

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/api/healthz > /dev/null; then
              echo "healthy on main"; exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          sudo systemctl status attendance --no-pager | head -n 30
          cd "$APP_DIR"
          git reset --hard "$PREVIOUS_SHA"
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix server ci --omit=dev --no-audit --no-fund
          # web/dist is untracked, so the reset above leaves the failed deploy's
          # bundle in place; rebuild it so the client matches the rolled-back API.
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web ci --include=dev --no-audit --no-fund
          PATH=/usr/bin:$PATH /usr/bin/npm --prefix web run build
          sudo /bin/systemctl restart attendance
          exit 1
